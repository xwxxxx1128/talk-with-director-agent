### model
# 基座权重
model_name_or_path: /mnt/workspace/models/models/Qwen--Qwen2.5-7B-Instruct/snapshots/master

adapter_name_or_path: /home/user/checkpoint-40

template: qwen
trust_remote_code: true

### export
# 合并后模型的输出目录
export_dir: /home/user/qwen2.5-7b-liang
# 每个分片最大 5GB（7B 全精度约 14~15GB，会切成 3 片）。不需要分片可删除此行
export_size: 5
# 在 CPU 上合并，不占 GPU（7B 合并需要约 15GB+ 内存，云机通常够）。想更快可改 cuda
export_device: cpu
# 输出 safetensors 新格式
export_legacy_format: false
